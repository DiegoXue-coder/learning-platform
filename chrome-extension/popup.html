<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 340px; padding: 20px; background: #f8fafc; }
    .logo { color: #1e40af; font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .sub  { color: #64748b; font-size: 12px; margin-bottom: 16px; }
    .btn  { width: 100%; padding: 12px; background: #1e40af; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: default; }
    .tip  { font-size: 11px; color: #94a3b8; margin-top: 8px; text-align: center; }
    .status { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 13px; display: none; line-height: 1.7; }
    .info    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; display: block; }
    .success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; display: block; }
    .error   { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; display: block; }
    #progress { font-size: 11px; color: #94a3b8; margin-top: 6px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="logo">🎓 Moodle 内容提取助手</div>
  <div class="sub">提取当前 Moodle 课程的所有内容，包含 PDF</div>

  <button class="btn" id="extractBtn">📥 提取当前课程内容</button>
  <div class="tip">请先在 Moodle 打开某门课的主页再点击</div>

  <div class="status" id="status"></div>
  <div id="progress"></div>

  <script src="popup.js"></script>
</body>
</html>
