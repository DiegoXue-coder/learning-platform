<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 320px;
      padding: 20px;
      background: #f8fafc;
    }
    .logo {
      color: #1e40af;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #1e40af;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: default; }
    .status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #166534;
      display: block;
    }
    .status.error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: block;
    }
    .cookie-box {
      margin-top: 10px;
      padding: 8px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 11px;
      color: #475569;
      word-break: break-all;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">🎓 Moodle 登录助手</div>

  <button class="btn" id="copyBtn" onclick="getCookie()">
    📋 一键复制登录凭证
  </button>

  <div class="status" id="status"></div>
  <div class="cookie-box" id="cookieBox" style="display:none"></div>
  <div class="hint" id="hint"></div>

  <script src="popup.js"></script>
</body>
</html>
